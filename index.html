<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Heart Letter</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="icon" href="icon.ico" type="image/x-icon">


</head>

<body>

  <div class="container">



    <!-- Sobre -->
    <div id="envelope" class="envelope">
      
      <!-- Base -->
      <div id="base" class="base">
        <div class="base-left"></div>
        <div class="base-right"></div>
        <div class="base-bottom"></div>
      </div>


      <!-- Tapa -->
      <div id="top" class="top">
          <div class="top-back"></div>
          <div class="cover">
            <div class="top-cap"></div>
            <div class="top-triangle"></div>
          </div>
      </div>

      <!-- Sello -->
      <div id="seal" class="seal">
        <div class="heart"></div>
      </div>

    </div>

    <!-- Carta -->
    <div id="letter" class="letter">
     <div class="letter-front">
        <!-- Sobre cerrado o diseño exterior -->
        <p>For You</p>
      </div>
      <div class="letter-back">
        <!-- Folio interior que se ve al abrir -->
        <p id="letter-text"></p>
      </div>
    </div>

     
  </div>
     

  <script src="./script.js"></script>
</body>
</html>
